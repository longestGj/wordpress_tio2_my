name: ${COMPOSE_PROJECT_NAME:-tio2products}

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  db:
    image: mariadb:11.4@sha256:4f1d8d202fcf7bcb3902f63af09f9c1a050c2922a89652f22abaec0d4f015e83
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME is required}
      MARIADB_USER: ${DB_USER:?DB_USER is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *bounded-logging

  wordpress:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:?DB_NAME is required}
      WORDPRESS_DB_USER: ${DB_USER:?DB_USER is required}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY:?WORDPRESS_AUTH_KEY is required}
      WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY:?WORDPRESS_SECURE_AUTH_KEY is required}
      WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY:?WORDPRESS_LOGGED_IN_KEY is required}
      WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY:?WORDPRESS_NONCE_KEY is required}
      WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT:?WORDPRESS_AUTH_SALT is required}
      WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT:?WORDPRESS_SECURE_AUTH_SALT is required}
      WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT:?WORDPRESS_LOGGED_IN_SALT is required}
      WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT:?WORDPRESS_NONCE_SALT is required}
      PUBLIC_URL: ${PUBLIC_URL:-https://tio2products.com}
      SITE_SCOPE: ${SITE_SCOPE:-tio2-my}
      TIO2_CONTENT_INIT_VERSION: ${TIO2_CONTENT_INIT_VERSION:-home-v1}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'production');
        define('TIO2_PUBLIC_URL', getenv('PUBLIC_URL') ?: 'https://tio2products.com');
        define('TIO2_SITE_SCOPE', getenv('SITE_SCOPE') ?: 'tio2-my');
        define('TIO2_RELEASE', getenv('TIO2_RELEASE') ?: '');
        define('WP_HOME', getenv('PUBLIC_URL'));
        define('WP_SITEURL', getenv('PUBLIC_URL'));
        define('DISALLOW_FILE_EDIT', true);
        define('DISALLOW_FILE_MODS', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('AUTOMATIC_UPDATER_DISABLED', true);
    volumes:
      - uploads_data:/var/www/html/wp-content/uploads
    networks:
      - backend
      - edge
    healthcheck:
      test: [CMD-SHELL, "php -r '$$socket=@fsockopen(\"127.0.0.1\",80);if(!$$socket){exit(1);}fclose($$socket);'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    logging: *bounded-logging

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - 80:80/tcp
      - 443:443/tcp
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    healthcheck:
      test: [CMD, caddy, version]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *bounded-logging

networks:
  edge:
  backend:
    internal: true

volumes:
  db_data:
    name: ${VOLUME_PREFIX:-tio2products}_db
  uploads_data:
    name: ${VOLUME_PREFIX:-tio2products}_uploads
  caddy_data:
    name: ${VOLUME_PREFIX:-tio2products}_caddy_data
  caddy_config:
    name: ${VOLUME_PREFIX:-tio2products}_caddy_config

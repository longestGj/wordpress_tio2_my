name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish immutable image
    needs: quality
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record build time
        id: metadata
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
      - name: Build and push SHA image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ghcr.io/longestgj/wordpress_tio2_my:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.created }}

  deploy:
    name: Deploy production
    needs: [quality, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROD_HOST: ${{ vars.PROD_HOST }}
      PROD_PORT: ${{ vars.PROD_PORT }}
      PROD_USER: ${{ vars.PROD_USER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate deployment variables
        run: |
          test -n "$PROD_HOST"
          test -n "$PROD_PORT"
          test -n "$PROD_USER"
          [[ "$PROD_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$PROD_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
      - name: Prepare verified SSH material
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p .runtime/ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" >.runtime/ssh/id_ed25519
          printf '%s\n' "$PROD_KNOWN_HOSTS" >.runtime/ssh/known_hosts
          ssh-keygen -y -f .runtime/ssh/id_ed25519 >/dev/null
          ssh-keygen -F "$PROD_HOST" -f .runtime/ssh/known_hosts >/dev/null \
            || ssh-keygen -F "[$PROD_HOST]:$PROD_PORT" -f .runtime/ssh/known_hosts >/dev/null
      - name: Create release bundle
        run: tar -C deploy -czf deploy-bundle.tar.gz compose.production.yaml Caddyfile scripts
      - name: Upload release bundle
        run: |
          scp -i .runtime/ssh/id_ed25519 -P "$PROD_PORT" \
            -o UserKnownHostsFile=.runtime/ssh/known_hosts -o StrictHostKeyChecking=yes \
            deploy-bundle.tar.gz "$PROD_USER@$PROD_HOST:/opt/tio2products/incoming/${GITHUB_SHA}.tar.gz"
      - name: Activate release
        run: |
          ssh -i .runtime/ssh/id_ed25519 -p "$PROD_PORT" \
            -o UserKnownHostsFile=.runtime/ssh/known_hosts -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" \
            "/opt/tio2products/bin/receive-release.sh '${GITHUB_SHA}' '/opt/tio2products/incoming/${GITHUB_SHA}.tar.gz'"
      - name: Remove ephemeral SSH material
        if: always()
        run: rm -rf .runtime/ssh deploy-bundle.tar.gz

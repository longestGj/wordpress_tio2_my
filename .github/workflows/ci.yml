name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

jobs:
  source-guard:
    name: Main source guard
    runs-on: ubuntu-24.04
    steps:
      - name: Require develop as the main PR source
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT_NAME" == pull_request && "$BASE_REF" == main && "$HEAD_REF" != develop ]]; then
            echo 'Pull requests to main must come from develop.' >&2
            exit 1
          fi

  php-content:
    name: PHP and content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: pip install --requirement requirements-dev.txt
      - name: Run portable and PHP contracts
        run: |
          python tests/portability-test.py
          python tests/runtime-settings-test.py
          docker run --rm --mount "type=bind,source=$PWD,target=/workspace" -w /workspace \
            wordpress:php8.3-apache@sha256:65919a9ca10940feb10d9400fead0d639bf86241f47c91e2b9ea4703aa8452cf \
            php -d zend.assertions=1 -d assert.exception=1 tests/php/runtime-config-test.php

  browser-integration:
    name: Browser integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: |
          npm ci
          pip install --requirement requirements-dev.txt
          npx playwright install --with-deps chromium
      - name: Start isolated WordPress
        run: bash scripts/ci-environment.sh up
      - name: Run live integration tests
        run: bash scripts/ci-environment.sh test
      - name: Stop isolated WordPress
        if: always()
        run: bash scripts/ci-environment.sh down
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-evidence-${{ github.sha }}
          path: .runtime/test-results
          if-no-files-found: warn
          retention-days: 14

  production-contract:
    name: Production deployment contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: pip install --requirement requirements-dev.txt
      - name: Validate workflows and production configuration
        run: |
          python tests/workflow-contract.py
          python tests/production-config-test.py
          python tests/provision-contract.py
      - name: Validate release scripts
        run: |
          for file in deploy/scripts/*.sh; do bash -n "$file"; done
          bash tests/deploy-scripts-test.sh
      - name: Build and bootstrap the production image
        run: |
          bash tests/image-contract.sh
          bash tests/bootstrap-production-test.sh
